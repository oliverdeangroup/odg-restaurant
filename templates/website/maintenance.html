{% load static %}<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>{{ brand.name }}</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 system-ui,sans-serif;background:#f4f6fa;color:#1f2433;padding:20px;text-align:center}.box{max-width:480px}img{max-height:90px;margin-bottom:16px}h1{font-size:24px;margin:0 0 8px}</style></head>
<body><div class="box">{% if brand.logo %}<img src="{{ brand.logo.url }}" alt="">{% endif %}<h1>{{ brand.name }}</h1><p>{{ message|linebreaksbr }}</p><p><a href="/login/">{% t "Log in" %}</a></p></div></body></html>
