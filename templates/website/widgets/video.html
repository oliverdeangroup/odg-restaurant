{% if video_file %}<figure class="wg wg-video"><div class="ratio"><video src="{{ video_file }}"{% if d.poster %} poster="{{ d.poster }}"{% endif %} controls preload="metadata" playsinline data-fix-duration></video></div>{% if d.caption %}<figcaption>{{ d.caption }}</figcaption>{% endif %}</figure>
{% elif video_src %}<figure class="wg wg-video"><div class="ratio"><iframe src="{{ video_src }}" title="{{ d.caption|default:'Video' }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>{% if d.caption %}<figcaption>{{ d.caption }}</figcaption>{% endif %}</figure>{% endif %}
